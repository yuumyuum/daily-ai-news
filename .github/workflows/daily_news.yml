name: Daily AI News Generator

on:
  schedule:
    # 평일(월~금) 한국 시간 기준. GitHub 예약 실행은 1~2시간씩 늦어질 수 있어 일찍, 두 번 걸어 둠.
    # cron 은 UTC 기준이라 한국의 월~금 = UTC 일~목.
    - cron: '13 20 * * 0-4'   # 05:13 KST 본 실행
    - cron: '43 21 * * 0-4'   # 06:43 KST 예비 실행 (이미 발행됐으면 아무것도 안 함)
  workflow_dispatch: # 깃허브 웹에서 버튼으로 수동 실행 가능하게 설정
    inputs:
      force:
        description: '오늘 호가 이미 있어도 다시 생성'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 오늘 호 JSON 생성 (data/ 에 추가만, index.html 은 그대로)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 선택: 저장소 Settings > Variables 에서 모델을 바꿀 수 있음 (비워 두면 gpt-4o)
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # 선택: GPT 자동 발행 시작일 (비워 두면 2026-10-20)
          GPT_START_DATE: ${{ vars.GPT_START_DATE }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python generate_news.py --force
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python generate_news.py --scheduled
          else
            python generate_news.py
          fi

      - name: 새 호 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/
          git commit -m "Auto Update: Daily AI News ($(TZ=Asia/Seoul date +'%Y-%m-%d'))" || exit 0
          git pull --rebase origin main
          git push
