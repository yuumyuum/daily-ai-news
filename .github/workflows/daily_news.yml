name: Daily AI News Generator

on:
  schedule:
    # 한국 시간 기준 매일 오전 07:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 깃허브 웹에서 버튼으로 수동 실행 가능하게 설정

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: GPT API로 뉴스 html 생성 스크립트 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_news.py

      - name: 업데이트된 index.html 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add index.html
          git commit -m "Auto Update: Daily AI News ($(date +'%Y-%m-%d'))" || exit 0
          git push
